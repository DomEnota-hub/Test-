name: VU-45 arm64 signed test release

on:
  push:
    branches:
      - feature/vu45-arm64
    paths:
      - app/**
      - patch/**
      - .github/workflows/vu45-arm64-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_CERT_SHA256: ea9fe9341a6ba72b585bd7ff82ce29c8fc5b7b59e76b8b134df203eaab8e2788
    steps:
      - uses: actions/checkout@v4

      - name: Verify complete overlay and source mirrors
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            app/build.gradle.kts \
            app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt \
            app/src/main/java/ru/railbrake/calculator/ui/Vu45Screen.kt \
            app/src/main/java/ru/railbrake/calculator/core/Vu45Calculator.kt \
            app/src/test/java/ru/railbrake/calculator/core/Vu45CalculatorTest.kt; do
            cmp "$file" "patch/$file"
          done
          grep -Fq 'include("arm64-v8a")' app/build.gradle.kts
          grep -Fq 'isUniversalApk = false' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract original build project and apply source overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/
          grep -Fq 'versionCode = 203' buildsrc/RailBrakeCalculator/app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-vu45-arm64-test2"' buildsrc/RailBrakeCalculator/app/build.gradle.kts

      - name: Kotlin/JVM unit tests (includes VU-45)
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 17m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 17m gradle :app:lintDebug --stacktrace --console=plain

      - name: Decode release signing material
        working-directory: buildsrc/RailBrakeCalculator
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RAILBRAKE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed arm64-v8a release APK
        working-directory: buildsrc/RailBrakeCalculator
        env:
          RAILBRAKE_KEYSTORE_PATH: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/release.keystore
          RAILBRAKE_STORE_PASSWORD: ${{ secrets.RAILBRAKE_STORE_PASSWORD }}
          RAILBRAKE_KEY_ALIAS: ${{ secrets.RAILBRAKE_KEY_ALIAS }}
          RAILBRAKE_KEY_PASSWORD: ${{ secrets.RAILBRAKE_KEY_PASSWORD }}
        run: timeout --signal=TERM 17m gradle :app:assembleRelease --stacktrace --console=plain

      - name: Verify ABI, signing certificate, package version
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find buildsrc/RailBrakeCalculator/app/build/outputs/apk/release \
            -maxdepth 1 -name '*arm64-v8a*release*.apk' -type f | sort)
          test "${#files[@]}" -eq 1
          apk="${files[0]}"
          test -s "$apk"
          ! find buildsrc/RailBrakeCalculator/app/build/outputs/apk/release -name '*universal*apk' | grep -q .
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/apksigner-vu45.log
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/apksigner-vu45.log
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$apk" | tee /tmp/vu45-badging.log
          grep -Fq "versionCode='203' versionName='1.2.2-dev14-vu45-arm64-test2'" /tmp/vu45-badging.log
          mkdir -p dist
          cp "$apk" dist/RailBrakeCalculator-VU45-arm64-v8a-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-VU45-arm64-v8a-release-signed
          path: dist/RailBrakeCalculator-VU45-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish clearly marked test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="vu45-arm64-test-${GITHUB_SHA::9}"
          gh release create "$tag" dist/RailBrakeCalculator-VU45-arm64-v8a-release.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "ВУ-45 · ARM64 тестовая сборка" \
            --notes "Тестовая подписанная ARM64 сборка с калькулятором отдельных показателей ВУ-45 и интеграцией в общий раздел История. НЕ является официальной справкой ВУ-45, подтверждением исправности тормозов или эксплуатационным допуском. Расчётные нормы требуют проверки на применимость."
