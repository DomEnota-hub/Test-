name: Dev14 source repair

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/dev14-source-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev14-integration
          fetch-depth: 0

      - name: Patch source mirrors
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/repair.py <<'PY'
          from pathlib import Path
          import re

          replacement = '''    private fun json(asset: String): JSONObject {
              return try {
                  context.assets.open(asset).bufferedReader().use { reader -> JSONObject(reader.readText()) }
              } catch (plainMissing: java.io.FileNotFoundException) {
                  context.assets.open("$asset.gz").use { input ->
                      GZIPInputStream(input).bufferedReader().use { reader -> JSONObject(reader.readText()) }
                  }
              }
          }

          '''

          for filename in (
              'app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt',
              'patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt',
          ):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              start = text.find('    private fun json(asset: String): JSONObject')
              end = text.find('    private fun loadVl80sProfiles()', start if start >= 0 else 0)
              if start < 0 or end <= start:
                  raise SystemExit('json loader block not found in ' + filename)
              path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          for filename in ('app/build.gradle.kts', 'patch/app/build.gradle.kts'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text, c1 = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 143', text, count=1)
              text, c2 = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.2.2-dev14-hotfix1"', text, count=1)
              if c1 != 1 or c2 != 1:
                  raise SystemExit('version block not found in ' + filename)
              path.write_text(text, encoding='utf-8')
          PY
          python3 /tmp/repair.py
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          grep -Fq 'context.assets.open(asset).bufferedReader()' app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          grep -Fq 'context.assets.open("$asset.gz")' app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          grep -Fq 'versionCode = 143' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-hotfix1"' app/build.gradle.kts
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add app patch
          git commit -m 'fix(dev14): make technical asset loading resilient'
          git push origin HEAD:dev14-integration
