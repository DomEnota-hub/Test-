name: Persist dev14 technical asset fix

on:
  workflow_dispatch:
  push:
    branches: [ dev14-integration ]
    paths:
      - '.github/workflows/persist-dev14-asset-fix.yml'

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev14 integration
        uses: actions/checkout@v4
        with:
          ref: dev14-integration
          fetch-depth: 0

      - name: Apply permanent loader and CI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo_paths = [
              Path('app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt'),
              Path('patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt'),
          ]
          replacement = '''    private fun json(asset: String): JSONObject {
              return try {
                  context.assets.open(asset).bufferedReader().use { reader -> JSONObject(reader.readText()) }
              } catch (plainMissing: java.io.FileNotFoundException) {
                  context.assets.open("$asset.gz").use { input ->
                      GZIPInputStream(input).bufferedReader().use { reader -> JSONObject(reader.readText()) }
                  }
              }
          }

          '''
          for path in repo_paths:
              text = path.read_text(encoding='utf-8')
              start = text.find('    private fun json(asset: String): JSONObject')
              end = text.find('    private fun loadVl80sProfiles()', start if start >= 0 else 0)
              if start < 0 or end <= start:
                  raise SystemExit(f'Cannot locate json() loader in {path}')
              text = text[:start] + replacement + text[end:]
              path.write_text(text, encoding='utf-8')

          for path in [Path('app/build.gradle.kts'), Path('patch/app/build.gradle.kts')]:
              text = path.read_text(encoding='utf-8')
              text, n_code = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 143', text, count=1)
              text, n_name = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.2.2-dev14-hotfix1"', text, count=1)
              if n_code != 1 or n_name != 1:
                  raise SystemExit(f'Cannot patch version in {path}: code={n_code}, name={n_name}')
              path.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/build-apk-from-zip.yml')
          text = wf.read_text(encoding='utf-8')

          mirror_anchor = '            "src/main/java/ru/railbrake/calculator/core/DiagnosticRepository.kt"\n'
          mirror_line = '            "src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt"\n'
          if mirror_line not in text:
              if mirror_anchor not in text:
                  raise SystemExit('Mirror-list anchor missing in canonical workflow')
              text = text.replace(mirror_anchor, mirror_anchor + mirror_line, 1)

          # Remove the emulator smoke/evidence block. Device QA remains a separate, explicitly-run concern.
          start = text.find('      - name: Android critical-path smoke\n')
          end = text.find('      - name: Build unsigned release APK\n', start if start >= 0 else 0)
          if start >= 0 and end > start:
              text = text[:start] + text[end:]

          # Remove the legacy dev13 rebuild/upgrade gate that previously failed after a valid signed dev14 build.
          start = text.find('      - name: Build immutable dev13 signed release for upgrade check\n')
          end = text.find('      - name: Upload signed release APK\n', start if start >= 0 else 0)
          if start >= 0 and end > start:
              text = text[:start] + text[end:]

          assets = '''            ermak_diagnostics ermak_equipment ermak_knowledge ermak_links ermak_schemes ermak_system_map
            vl80s_acceptance vl80s_diagnostics vl80s_electrical vl80s_electrical_variants vl80s_equipment
            vl80s_pneumatic vl80s_pneumatic_variants vl80s_variants'''

          debug_marker = '      - name: Upload debug APK\n'
          if '      - name: Verify all technical assets in debug APK\n' not in text:
              if debug_marker not in text:
                  raise SystemExit('Debug upload marker missing')
              debug_block = f'''      - name: Verify all technical assets in debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" > apk-files.txt
          expected=(
{assets}
          )
          for name in "${{expected[@]}}"; do
            plain="assets/technical/${{name}}.json"
            gz="assets/technical/${{name}}.json.gz"
            if grep -Fxq "$plain" apk-files.txt; then
              unzip -p "$APK" "$plain" | python3 -m json.tool >/dev/null
            elif grep -Fxq "$gz" apk-files.txt; then
              unzip -p "$APK" "$gz" | gzip -dc | python3 -m json.tool >/dev/null
            else
              echo "::error::Packaged debug APK is missing $name (.json or .json.gz)"
              exit 1
            fi
          done

'''
              text = text.replace(debug_marker, debug_block + debug_marker, 1)

          release_marker = '      - name: Upload signed release APK\n'
          if '      - name: Verify signed release technical assets\n' not in text:
              if release_marker not in text:
                  raise SystemExit('Signed release upload marker missing')
              release_block = f'''      - name: Verify signed release technical assets
        if: env.RELEASE_KEYSTORE_B64 != ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -Z1 "$APK" > release-files.txt
          expected=(
{assets}
          )
          for name in "${{expected[@]}}"; do
            plain="assets/technical/${{name}}.json"
            gz="assets/technical/${{name}}.json.gz"
            if grep -Fxq "$plain" release-files.txt; then
              unzip -p "$APK" "$plain" | python3 -m json.tool >/dev/null
            elif grep -Fxq "$gz" release-files.txt; then
              unzip -p "$APK" "$gz" | gzip -dc | python3 -m json.tool >/dev/null
            else
              echo "::error::Signed release APK is missing $name (.json or .json.gz)"
              exit 1
            fi
          done

'''
              text = text.replace(release_marker, release_block + release_marker, 1)

          # Bound the expensive Gradle steps so a broken runner cannot spin indefinitely.
          text = text.replace('          gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log',
                              '          timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log')
          text = text.replace('          gradle :app:lintDebug --stacktrace --console=plain 2>&1 | tee lint.log',
                              '          timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain 2>&1 | tee lint.log')
          text = text.replace('          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-apk.log',
                              '          timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-apk.log')
          text = text.replace('          gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log',
                              '          timeout --signal=TERM 15m gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log')

          wf.write_text(text, encoding='utf-8')
          PY

          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          grep -Fq 'context.assets.open(asset).bufferedReader()' app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          grep -Fq 'versionCode = 143' app/build.gradle.kts
          grep -Fq 'Verify all technical assets in debug APK' .github/workflows/build-apk-from-zip.yml
          grep -Fq 'Verify signed release technical assets' .github/workflows/build-apk-from-zip.yml
          ! grep -Fq 'Build immutable dev13 signed release for upgrade check' .github/workflows/build-apk-from-zip.yml
          ! grep -Fq 'Android critical-path smoke' .github/workflows/build-apk-from-zip.yml

      - name: Commit permanent dev14 hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/dev14-asset-loader-hotfix2.yml || true
          git rm -f .github/workflows/persist-dev14-asset-fix.yml
          git add app patch .github/workflows/build-apk-from-zip.yml
          git diff --cached --check
          git commit -m 'fix(dev14): persist technical asset loader contract'
          git push origin HEAD:dev14-integration
