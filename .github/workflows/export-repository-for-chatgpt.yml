name: Export repository for ChatGPT

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-repository-for-chatgpt.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository state before export helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.before }}
          fetch-depth: 1

      - name: Stage repository contents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Test-repository"
          rsync -a --exclude='.git/' ./ "$RUNNER_TEMP/Test-repository/"

      - name: Upload repository archive
        uses: actions/upload-artifact@v4
        with:
          name: Test-repository-main
          path: ${{ runner.temp }}/Test-repository
          include-hidden-files: true
          compression-level: 6
          retention-days: 7
