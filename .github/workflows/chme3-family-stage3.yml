name: ChME3 family stage 3 diagnostics

on:
  push:
    branches:
      - feature/locomotive-knowledge-foundation
    paths:
      - 'docs/locomotives/chme3/**'
      - 'docs/locomotives/diesel/chme3-family/**'
      - 'docs/diagnostics/LOCOMOTIVE_DIAGNOSTIC_RUNTIME_CONTRACT_V2.md'
      - 'qa/validate_chme3_diagnostics_v3.py'
      - 'qa/audit_chme3_diagnostic_semantics_v4.py'
      - 'qa/validate_chme3_family_stage3.py'
      - 'qa/validate_chme3e_stage2.py'
      - 'qa/validate_chme3_interactive.py'
      - '.github/workflows/chme3-family-stage3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate legacy ChME3 diagnostic metadata
        run: python qa/validate_chme3_diagnostics_v3.py
      - name: Require complete legacy runtime-v2 semantic coverage
        run: python qa/audit_chme3_diagnostic_semantics_v4.py --require-complete
      - name: Validate canonical family Stage 3 and ChME3E layer
        run: python qa/validate_chme3_family_stage3.py
      - name: Preserve ChME3E Stage 2 Atlas contract
        run: python qa/validate_chme3e_stage2.py
      - name: Preserve ChME3 family interactive contract
        run: python qa/validate_chme3_interactive.py
