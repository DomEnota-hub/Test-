name: Build merged RailBrakeCalculator v1.2 temp

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v12-merged-temp.yml'
      - '.ci/v12-patch-part-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify merge patch
        shell: bash
        run: |
          cat .ci/v12-patch-part-* > /tmp/v12.patch
          echo "Patch SHA256: $(sha256sum /tmp/v12.patch | awk '{print $1}')"
          test "$(sha256sum /tmp/v12.patch | awk '{print $1}')" = "e7edc9dcdd119100b89bc3427c8666ca4b7451daeeb7fbf749b83a74604d5b16"

      - name: Extract current v1.1 source and apply merge
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cd buildsrc/RailBrakeCalculator
          patch --batch -p1 < /tmp/v12.patch
          mkdir -p app/src/main/res/drawable-nodpi
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQMcAAAAASUVORK5CYII=' | base64 --decode > app/src/main/res/drawable-nodpi/vl80s_layout_section1.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug --stacktrace --console=plain 2>&1 | tee lint.log

      - name: Build debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-debug.log

      - name: Build unsigned release APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log

      - name: Verify package and version metadata
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-badging.log
          grep -q "package: name='ru.railbrake.calculator' versionCode='120' versionName='1.2.0-dev1'" apk-badging.log

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-v12-unsigned-temp
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-v12-debug-temp
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-v12-verification-logs
          path: |
            buildsrc/RailBrakeCalculator/unit-tests.log
            buildsrc/RailBrakeCalculator/lint.log
            buildsrc/RailBrakeCalculator/build-debug.log
            buildsrc/RailBrakeCalculator/build-release.log
            buildsrc/RailBrakeCalculator/apk-badging.log
            buildsrc/RailBrakeCalculator/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 3
