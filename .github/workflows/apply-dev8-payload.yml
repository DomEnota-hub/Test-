name: Apply dev8 design payload

on:
  push:
    branches: [ dev8-design-staging ]
    paths:
      - '.dev8/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply payload
        shell: bash
        run: |
          set -euo pipefail
          cat .dev8/part-* | base64 --decode > /tmp/dev8-payload.tar.gz
          echo "06db98d4cd7364b6d30a7d1cb06b049f59cf40ad085faec4c24850c71eedcc04  /tmp/dev8-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/dev8-payload.tar.gz
          rm -rf .dev8
          rm -f .github/workflows/apply-dev8-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Redesign application shell for dev8"
          git push origin HEAD:dev8-design-staging
