# Canonical Android verification/build workflow for dev14.
# Device/emulator QA is intentionally separate from release delivery: hosted emulator
# instability must not prevent publication of an otherwise valid signed APK.
name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master, vl80s-qa-dev5, dev8-design, dev14-integration ]
    paths:
      - 'RailBrakeCalculator.zip'
      - 'patch/**'
      - 'app/**'
      - 'qa/**'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RAILBRAKE_KEYSTORE_BASE64 }}
      EXPECTED_SIGNING_CERT_SHA256: ea9fe9341a6ba72b585bd7ff82ce29c8fc5b7b59e76b8b134df203eaab8e2788

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Structural preflight and mirror audit
        shell: bash
        run: |
          set -euo pipefail

          mirror_files=(
            "build.gradle.kts"
            "src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt"
            "src/main/java/ru/railbrake/calculator/core/DiagnosticRepository.kt"
            "src/main/java/ru/railbrake/calculator/core/Vl80sNormalValues.kt"
            "src/main/java/ru/railbrake/calculator/core/Vl80sObservationCatalog.kt"
            "src/main/java/ru/railbrake/calculator/ui/DiagnosticScreen.kt"
            "src/main/java/ru/railbrake/calculator/ui/KnowledgeBaseScreen.kt"
            "src/test/java/ru/railbrake/calculator/core/DiagnosticRepositoryTest.kt"
            "src/test/java/ru/railbrake/calculator/core/LocomotiveProfileTest.kt"
          )
          for rel in "${mirror_files[@]}"; do
            if [ -f "app/$rel" ] && [ -f "patch/app/$rel" ]; then
              cmp "app/$rel" "patch/app/$rel" || {
                echo "::error file=app/$rel::Root mirror differs from patch/app/$rel"
                exit 1
              }
            fi
          done

          grep -Fq 'context.assets.open(asset).bufferedReader()' app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          grep -Fq 'context.assets.open("$asset.gz")' app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt

          technical_assets=(
            ermak_diagnostics ermak_equipment ermak_knowledge ermak_links ermak_schemes ermak_system_map
            vl80s_acceptance vl80s_diagnostics vl80s_electrical vl80s_electrical_variants vl80s_equipment
            vl80s_pneumatic vl80s_pneumatic_variants vl80s_variants
          )
          for name in "${technical_assets[@]}"; do
            root="app/src/main/assets/technical/${name}.json.gz"
            overlay="patch/app/src/main/assets/technical/${name}.json.gz"
            test -f "$root" || { echo "::error::Missing root technical asset $root"; exit 1; }
            test -f "$overlay" || { echo "::error::Missing overlay technical asset $overlay"; exit 1; }
            cmp "$root" "$overlay" || { echo "::error::Technical asset mirror mismatch: $name"; exit 1; }
          done

      - name: Upload current source archive snapshot
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-source-snapshot
          path: RailBrakeCalculator.zip
          if-no-files-found: error
          retention-days: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract canonical project and overlay patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/
          test -f buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/core/BrakeCalculator.kt
          cmp patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt

      - name: Read expected app version
        id: version
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: Run unit tests
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain 2>&1 | tee lint.log

      - name: Build debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-apk.log

      - name: Verify all technical assets in debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" > apk-files.txt
          expected=(
            ermak_diagnostics ermak_equipment ermak_knowledge ermak_links ermak_schemes ermak_system_map
            vl80s_acceptance vl80s_diagnostics vl80s_electrical vl80s_electrical_variants vl80s_equipment
            vl80s_pneumatic vl80s_pneumatic_variants vl80s_variants
          )
          for name in "${expected[@]}"; do
            plain="assets/technical/${name}.json"
            gz="assets/technical/${name}.json.gz"
            if grep -Fxq "$plain" apk-files.txt; then
              unzip -p "$APK" "$plain" | python3 -m json.tool >/dev/null
            elif grep -Fxq "$gz" apk-files.txt; then
              unzip -p "$APK" "$gz" | gzip -dc | python3 -m json.tool >/dev/null
            else
              echo "::error::Debug APK is missing $name (.json or .json.gz)"
              exit 1
            fi
          done
          echo "All 14 technical assets are present and parseable in debug APK."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-${{ steps.version.outputs.version_name }}-debug
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build unsigned release APK
        if: env.RELEASE_KEYSTORE_B64 == ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log

      - name: Verify unsigned release metadata and technical assets
        if: env.RELEASE_KEYSTORE_B64 == ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-badging.log
          grep -Fq "package: name='ru.railbrake.calculator' versionCode='${{ steps.version.outputs.version_code }}' versionName='${{ steps.version.outputs.version_name }}'" apk-badging.log
          unzip -Z1 "$APK" > release-files.txt
          for name in ermak_diagnostics ermak_equipment ermak_knowledge ermak_links ermak_schemes ermak_system_map vl80s_acceptance vl80s_diagnostics vl80s_electrical vl80s_electrical_variants vl80s_equipment vl80s_pneumatic vl80s_pneumatic_variants vl80s_variants; do
            grep -Eq "^assets/technical/${name}\.json(\.gz)?$" release-files.txt || { echo "::error::Unsigned release missing $name"; exit 1; }
          done

      - name: Upload unsigned release APK
        if: env.RELEASE_KEYSTORE_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-${{ steps.version.outputs.version_name }}-release-unsigned
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Decode release signing key
        if: env.RELEASE_KEYSTORE_B64 != ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        if: env.RELEASE_KEYSTORE_B64 != ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        env:
          RAILBRAKE_KEYSTORE_PATH: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/release.keystore
          RAILBRAKE_STORE_PASSWORD: ${{ secrets.RAILBRAKE_STORE_PASSWORD }}
          RAILBRAKE_KEY_ALIAS: ${{ secrets.RAILBRAKE_KEY_ALIAS }}
          RAILBRAKE_KEY_PASSWORD: ${{ secrets.RAILBRAKE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log

      - name: Verify signed release metadata and developer certificate
        if: env.RELEASE_KEYSTORE_B64 != ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-badging.log
          grep -Fq "package: name='ru.railbrake.calculator' versionCode='${{ steps.version.outputs.version_code }}' versionName='${{ steps.version.outputs.version_name }}'" apk-badging.log
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signed-apksigner.log
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNING_CERT_SHA256" signed-apksigner.log

      - name: Verify all technical assets in signed release APK
        if: env.RELEASE_KEYSTORE_B64 != ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -Z1 "$APK" > release-files.txt
          expected=(
            ermak_diagnostics ermak_equipment ermak_knowledge ermak_links ermak_schemes ermak_system_map
            vl80s_acceptance vl80s_diagnostics vl80s_electrical vl80s_electrical_variants vl80s_equipment
            vl80s_pneumatic vl80s_pneumatic_variants vl80s_variants
          )
          for name in "${expected[@]}"; do
            plain="assets/technical/${name}.json"
            gz="assets/technical/${name}.json.gz"
            if grep -Fxq "$plain" release-files.txt; then
              unzip -p "$APK" "$plain" | python3 -m json.tool >/dev/null
            elif grep -Fxq "$gz" release-files.txt; then
              unzip -p "$APK" "$gz" | gzip -dc | python3 -m json.tool >/dev/null
            else
              echo "::error::Signed release APK is missing $name (.json or .json.gz)"
              exit 1
            fi
          done
          echo "All 14 technical assets are present and parseable in signed release APK."

      - name: Upload signed release APK
        if: env.RELEASE_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-${{ steps.version.outputs.version_name }}-release-signed
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show useful Gradle errors
        if: failure()
        shell: bash
        run: |
          echo "===== BUILD ERROR SUMMARY ====="
          for f in buildsrc/RailBrakeCalculator/unit-tests.log buildsrc/RailBrakeCalculator/lint.log buildsrc/RailBrakeCalculator/build-apk.log buildsrc/RailBrakeCalculator/build-release.log buildsrc/RailBrakeCalculator/signed-apksigner.log; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              grep -nEi '(^e:|error:|FAILURE:|What went wrong|Execution failed|Caused by:|Could not|Unresolved reference|Compilation error|Lint found|Signer #1 certificate SHA-256)' "$f" | tail -n 120 || true
              tail -n 100 "$f" || true
            fi
          done

      - name: Upload Gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ steps.version.outputs.version_name || 'unknown' }}
          path: |
            buildsrc/RailBrakeCalculator/build-apk.log
            buildsrc/RailBrakeCalculator/build-release.log
            buildsrc/RailBrakeCalculator/unit-tests.log
            buildsrc/RailBrakeCalculator/lint.log
            buildsrc/RailBrakeCalculator/apk-files.txt
            buildsrc/RailBrakeCalculator/release-files.txt
            buildsrc/RailBrakeCalculator/apk-badging.log
            buildsrc/RailBrakeCalculator/signed-apksigner.log
            buildsrc/RailBrakeCalculator/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
