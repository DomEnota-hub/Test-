name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'RailBrakeCalculator.zip'
      - 'patch/**'
      - '.github/workflows/build-apk-from-zip.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RAILBRAKE_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload current source archive snapshot
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-source-snapshot
          path: RailBrakeCalculator.zip
          if-no-files-found: error
          retention-days: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          if [ -d patch ]; then cp -a patch/. buildsrc/RailBrakeCalculator/; fi
          test -f buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/core/BrakeCalculator.kt

      - name: Run unit tests
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug --stacktrace --console=plain 2>&1 | tee lint.log

      - name: Build debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-apk.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-debug
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build unsigned release APK
        if: env.RELEASE_KEYSTORE_B64 == ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log

      - name: Verify package and version metadata
        if: env.RELEASE_KEYSTORE_B64 == ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-badging.log
          grep -q "package: name='ru.railbrake.calculator' versionCode='127' versionName='1.2.0-dev8'" apk-badging.log

      - name: Upload unsigned release APK
        if: env.RELEASE_KEYSTORE_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-release-unsigned
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare Android signing tools
        if: env.RELEASE_KEYSTORE_B64 == ''
        shell: bash
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign" signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/34.0.0/lib/apksigner.jar" signing-tools/lib/

      - name: Upload Android signing tools
        if: env.RELEASE_KEYSTORE_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools
          if-no-files-found: error
          retention-days: 7

      - name: Decode release signing key
        if: env.RELEASE_KEYSTORE_B64 != ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: echo "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Build signed release APK
        if: env.RELEASE_KEYSTORE_B64 != ''
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        env:
          RAILBRAKE_KEYSTORE_PATH: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/release.keystore
          RAILBRAKE_STORE_PASSWORD: ${{ secrets.RAILBRAKE_STORE_PASSWORD }}
          RAILBRAKE_KEY_ALIAS: ${{ secrets.RAILBRAKE_KEY_ALIAS }}
          RAILBRAKE_KEY_PASSWORD: ${{ secrets.RAILBRAKE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log

      - name: Upload signed release APK
        if: env.RELEASE_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-release
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Show useful Gradle errors
        if: failure()
        shell: bash
        run: |
          echo "===== BUILD ERROR SUMMARY ====="
          for f in buildsrc/RailBrakeCalculator/unit-tests.log buildsrc/RailBrakeCalculator/lint.log buildsrc/RailBrakeCalculator/build-apk.log buildsrc/RailBrakeCalculator/build-release.log; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              grep -nEi '(^e:|error:|FAILURE:|What went wrong|Execution failed|Caused by:|Could not|Unresolved reference|Compilation error|Lint found)' "$f" | tail -n 120 || true
              tail -n 100 "$f" || true
            fi
          done

      - name: Upload Gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            buildsrc/RailBrakeCalculator/build-apk.log
            buildsrc/RailBrakeCalculator/build-release.log
            buildsrc/RailBrakeCalculator/unit-tests.log
            buildsrc/RailBrakeCalculator/lint.log
            buildsrc/RailBrakeCalculator/apk-badging.log
            buildsrc/RailBrakeCalculator/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
