name: Build Package B stepwise flows

on:
  push:
    branches:
      - integration/chme3-assistant
    paths:
      - '.github/workflows/package-b-build-stepwise.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Guard branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/chme3-assistant
          test "$(git rev-parse origin/integration/chme3-assistant)" = "$GITHUB_SHA"
      - name: Generate Package B assets
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/build_package_b_stepwise_flows.py
          python3 qa/validate_package_b_stepwise_flows.py
          git diff --check
      - name: Commit generated assets and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/assets/technical/stepwise_scheme_flows.json \
                  patch/app/src/main/assets/technical/stepwise_scheme_flows.json \
                  docs/integration/PACKAGE_B_STEPWISE_FLOWS_CHECKPOINT.md
          git diff --cached --check
          git config user.name "DomEnota-hub"
          git config user.email "domenota6212@gmail.com"
          git commit -m "data: add source-backed stepwise scheme flows"
          git fetch origin integration/chme3-assistant
          test "$(git rev-parse origin/integration/chme3-assistant)" = "$GITHUB_SHA"
          git push origin HEAD:integration/chme3-assistant
