name: Scheduled signed VL80S dev11 build

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RAILBRAKE_KEYSTORE_BASE64 }}
      EXPECTED_SIGNING_CERT_SHA256: ea9fe9341a6ba72b585bd7ff82ce29c8fc5b7b59e76b8b134df203eaab8e2788

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify checked-in source mirrors
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "build.gradle.kts"
            "src/main/java/ru/railbrake/calculator/core/DiagnosticRepository.kt"
            "src/main/java/ru/railbrake/calculator/core/LocomotiveProfile.kt"
            "src/main/java/ru/railbrake/calculator/core/Vl80sNormalValues.kt"
            "src/main/java/ru/railbrake/calculator/core/Vl80sObservationCatalog.kt"
            "src/main/java/ru/railbrake/calculator/ui/DiagnosticScreen.kt"
            "src/main/java/ru/railbrake/calculator/ui/KnowledgeBaseScreen.kt"
            "src/test/java/ru/railbrake/calculator/core/DiagnosticRepositoryTest.kt"
            "src/test/java/ru/railbrake/calculator/core/LocomotiveProfileTest.kt"
          )
          for rel in "${files[@]}"; do
            if [ -f "app/$rel" ] && [ -f "patch/app/$rel" ]; then
              cmp "app/$rel" "patch/app/$rel"
            fi
          done

      - name: Require signing material
        shell: bash
        run: |
          test -n "$RELEASE_KEYSTORE_B64" || { echo "Release signing key is unavailable"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract canonical project and overlay patch
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Run unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: gradle :app:lintDebug --stacktrace --console=plain

      - name: Decode release signing key
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: echo "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Build signed release APK
        working-directory: buildsrc/RailBrakeCalculator
        env:
          RAILBRAKE_KEYSTORE_PATH: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/release.keystore
          RAILBRAKE_STORE_PASSWORD: ${{ secrets.RAILBRAKE_STORE_PASSWORD }}
          RAILBRAKE_KEY_ALIAS: ${{ secrets.RAILBRAKE_KEY_ALIAS }}
          RAILBRAKE_KEY_PASSWORD: ${{ secrets.RAILBRAKE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Verify package, version and certificate
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-badging.log
          grep -q "package: name='ru.railbrake.calculator' versionCode='139' versionName='1.2.2-dev11'" apk-badging.log
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signed-apksigner.log
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNING_CERT_SHA256" signed-apksigner.log

      - name: Stage signed APK
        shell: bash
        run: |
          mkdir -p out
          cp buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk out/RailBrakeCalculator-1.2.2-dev11-vl80s-fixed.apk
          sha256sum out/RailBrakeCalculator-1.2.2-dev11-vl80s-fixed.apk | tee out/SHA256SUMS.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-1.2.2-dev11-vl80s-fixed
          path: |
            out/RailBrakeCalculator-1.2.2-dev11-vl80s-fixed.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish run locator
        shell: bash
        run: |
          mkdir -p artifacts
          printf 'run_id=%s\nhead_sha=%s\nversion=1.2.2-dev11\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > artifacts/vl80s-fixed-latest-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/vl80s-fixed-latest-run.txt
          git commit -m "Publish VL80S dev11 build locator [run $GITHUB_RUN_ID]"
          git push origin HEAD:main
