name: Temporary source export

on:
  push:
    branches:
      - feature/offline-assistant-v0.9

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack source tree
        run: |
          zip -r RailBrakeCalculator-Test-offline-assistant-v0.9-source.zip . \
            -x '.git/*' \
               '.gradle/*' \
               '**/build/*' \
               '*.apk' \
               '*.aab'

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-Test-offline-assistant-v0.9-source
          path: RailBrakeCalculator-Test-offline-assistant-v0.9-source.zip
          if-no-files-found: error
          retention-days: 1
