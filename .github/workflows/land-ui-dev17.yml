name: Land validated technical UI dev17

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/land-ui-dev17.yml'

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reapply exact validated repair
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/"BLOK_2ES5K"/"blok_2es5k"/' .github/repair-ui-dev17.py
          python3 .github/repair-ui-dev17.py
          git diff --check
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalPresentation.kt patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalPresentation.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/TechnicalPresentationTest.kt patch/app/src/test/java/ru/railbrake/calculator/core/TechnicalPresentationTest.kt
          grep -Fq 'versionCode = 145' app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev17"' app/build.gradle.kts

      - name: Commit only validated application sources
        shell: bash
        run: |
          set -euo pipefail
          git reset
          git add README.md \
            app/build.gradle.kts \
            app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
            app/src/main/java/ru/railbrake/calculator/core/TechnicalPresentation.kt \
            app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt \
            app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt \
            app/src/test/java/ru/railbrake/calculator/core/TechnicalPresentationTest.kt \
            patch/app/build.gradle.kts \
            patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt \
            patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalPresentation.kt \
            patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt \
            patch/app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/TechnicalPresentationTest.kt
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair technical catalog presentation in dev17'
          git push origin HEAD:main
