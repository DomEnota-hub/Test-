name: Dev14 technical asset hotfix

on:
  workflow_dispatch:
  push:
    branches: [ dev14-integration ]
    paths:
      - '.github/workflows/dev14-asset-loader-hotfix.yml'

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RAILBRAKE_KEYSTORE_BASE64 }}
      EXPECTED_SIGNING_CERT_SHA256: ea9fe9341a6ba72b585bd7ff82ce29c8fc5b7b59e76b8b134df203eaab8e2788

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Structural preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f RailBrakeCalculator.zip
          test -f patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          test -d patch/app/src/main/assets/technical
          test -n "$RELEASE_KEYSTORE_B64"
          expected=(
            ermak_diagnostics ermak_equipment ermak_knowledge ermak_links ermak_schemes ermak_system_map
            vl80s_acceptance vl80s_diagnostics vl80s_electrical vl80s_electrical_variants vl80s_equipment
            vl80s_pneumatic vl80s_pneumatic_variants vl80s_variants
          )
          for name in "${expected[@]}"; do
            test -f "patch/app/src/main/assets/technical/${name}.json.gz" || {
              echo "::error::Missing canonical technical asset: ${name}.json.gz"
              exit 1
            }
            if [ -f "app/src/main/assets/technical/${name}.json.gz" ]; then
              cmp "app/src/main/assets/technical/${name}.json.gz" "patch/app/src/main/assets/technical/${name}.json.gz" || {
                echo "::error::Technical asset mirror mismatch: $name"
                exit 1
              }
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract canonical dev13 project and overlay dev14 patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/
          test -f buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt

      - name: Patch technical asset loader and hotfix version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt')
          text = repo.read_text(encoding='utf-8')
          old = '''    private fun json(asset: String): JSONObject =
              context.assets.open("$asset.gz").use { input ->
                  GZIPInputStream(input).bufferedReader().use { reader -> JSONObject(reader.readText()) }
              }
          '''
          new = '''    private fun json(asset: String): JSONObject {
              return try {
                  context.assets.open(asset).bufferedReader().use { reader -> JSONObject(reader.readText()) }
              } catch (plainMissing: java.io.FileNotFoundException) {
                  context.assets.open("$asset.gz").use { input ->
                      GZIPInputStream(input).bufferedReader().use { reader -> JSONObject(reader.readText()) }
                  }
              }
          }
          '''
          if old not in text:
              if 'context.assets.open(asset).bufferedReader()' not in text:
                  raise SystemExit('Expected TechnicalDataRepository asset-loader block was not found')
          else:
              text = text.replace(old, new, 1)
              repo.write_text(text, encoding='utf-8')

          gradle = Path('buildsrc/RailBrakeCalculator/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode = 142', 'versionCode = 143', 1)
          g = g.replace('versionName = "1.2.2-dev14"', 'versionName = "1.2.2-dev14-hotfix1"', 1)
          gradle.write_text(g, encoding='utf-8')
          PY
          grep -Fq 'context.assets.open(asset).bufferedReader()' buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          grep -Fq 'versionCode = 143' buildsrc/RailBrakeCalculator/app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-hotfix1"' buildsrc/RailBrakeCalculator/app/build.gradle.kts

      - name: Run unit tests
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Build debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-debug.log

      - name: Verify technical assets in debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" > apk-files.txt
          expected=(
            ermak_diagnostics ermak_equipment ermak_knowledge ermak_links ermak_schemes ermak_system_map
            vl80s_acceptance vl80s_diagnostics vl80s_electrical vl80s_electrical_variants vl80s_equipment
            vl80s_pneumatic vl80s_pneumatic_variants vl80s_variants
          )
          for name in "${expected[@]}"; do
            plain="assets/technical/${name}.json"
            gz="assets/technical/${name}.json.gz"
            if grep -Fxq "$plain" apk-files.txt; then
              unzip -p "$APK" "$plain" | python3 -m json.tool >/dev/null
            elif grep -Fxq "$gz" apk-files.txt; then
              unzip -p "$APK" "$gz" | gzip -dc | python3 -m json.tool >/dev/null
            else
              echo "::error::Packaged APK is missing $name (.json or .json.gz)"
              exit 1
            fi
          done
          echo "All 14 technical assets are present and parseable in the APK."

      - name: Decode release signing key
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        env:
          RAILBRAKE_KEYSTORE_PATH: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/release.keystore
          RAILBRAKE_STORE_PASSWORD: ${{ secrets.RAILBRAKE_STORE_PASSWORD }}
          RAILBRAKE_KEY_ALIAS: ${{ secrets.RAILBRAKE_KEY_ALIAS }}
          RAILBRAKE_KEY_PASSWORD: ${{ secrets.RAILBRAKE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log

      - name: Verify release package, signature and technical assets
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-badging.log
          grep -Fq "package: name='ru.railbrake.calculator' versionCode='143' versionName='1.2.2-dev14-hotfix1'" apk-badging.log
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signed-apksigner.log
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNING_CERT_SHA256" signed-apksigner.log
          unzip -Z1 "$APK" > release-files.txt
          for name in vl80s_acceptance vl80s_electrical vl80s_diagnostics vl80s_equipment ermak_diagnostics ermak_schemes; do
            grep -Eq "^assets/technical/${name}\.json(\.gz)?$" release-files.txt || {
              echo "::error::Release APK missing runtime asset $name"
              exit 1
            }
          done

      - name: Upload signed hotfix APK
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-1.2.2-dev14-hotfix1-release-signed
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload hotfix verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev14-hotfix1-verification
          path: |
            buildsrc/RailBrakeCalculator/unit-tests.log
            buildsrc/RailBrakeCalculator/build-debug.log
            buildsrc/RailBrakeCalculator/build-release.log
            buildsrc/RailBrakeCalculator/apk-files.txt
            buildsrc/RailBrakeCalculator/release-files.txt
            buildsrc/RailBrakeCalculator/apk-badging.log
            buildsrc/RailBrakeCalculator/signed-apksigner.log
          if-no-files-found: warn
          retention-days: 7
