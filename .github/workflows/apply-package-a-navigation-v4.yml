name: Apply Package A navigation architecture v4

on:
  push:
    branches:
      - integration/chme3-assistant
    paths:
      - '.github/workflows/apply-package-a-navigation-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/chme3-assistant
          test "$(git rev-parse origin/integration/chme3-assistant)" = "$GITHUB_SHA"

      - name: Apply previously validated Package A patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-package-a-navigation-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(body)
          bad = "if (roots[0].joinpath(rel).read_text() != roots[1].joinpath(rel).read_text():"
          good = "if roots[0].joinpath(rel).read_text() != roots[1].joinpath(rel).read_text():"
          if bad not in script:
              raise SystemExit('Expected v2 syntax typo not found; refusing to guess patch body')
          exec(compile(script.replace(bad, good, 1), 'package-a-v2-fixed.py', 'exec'))
          PY
          git diff --check

      - name: Verify Package A mirrors and invariants
        shell: bash
        run: |
          set -euo pipefail
          for rel in \
            core/LocomotiveCatalogRegistry.kt \
            core/UserFacingTechnicalPolicy.kt \
            core/TechnicalDataRepository.kt \
            core/TechnicalPresentation.kt \
            ui/HomeScreen.kt \
            ui/TechnicalCatalogScreen.kt \
            ui/LocomotiveDiagnosticsScreen.kt \
            ui/BrakeCalculatorApp.kt; do
            cmp "app/src/main/java/ru/railbrake/calculator/$rel" "patch/app/src/main/java/ru/railbrake/calculator/$rel"
          done
          for test in LocomotiveCatalogRegistryTest.kt UserFacingTechnicalPolicyTest.kt; do
            cmp "app/src/test/java/ru/railbrake/calculator/core/$test" "patch/app/src/test/java/ru/railbrake/calculator/core/$test"
          done
          grep -q 'LocomotiveCatalogRegistry.families' app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt
          grep -q 'LocomotiveCatalogRegistry.families' app/src/main/java/ru/railbrake/calculator/ui/LocomotiveDiagnosticsScreen.kt
          grep -q 'workingVariantId.takeIf { family == workingFamily }' app/src/main/java/ru/railbrake/calculator/ui/LocomotiveDiagnosticsScreen.kt
          grep -q 'lockFamily = false' app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          ! grep -q 'listOf(TechnicalFamily.VL80S, TechnicalFamily.ERMAK)' app/src/main/java/ru/railbrake/calculator/ui/TechnicalCatalogScreen.kt

      - name: Commit Package A implementation
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/java patch/app/src/main/java
          git diff --cached --check
          git config user.name "DomEnota-hub"
          git config user.email "domenota6212@gmail.com"
          git commit -m "feat: centralize locomotive viewing context"
          git fetch origin integration/chme3-assistant
          test "$(git rev-parse origin/integration/chme3-assistant)" = "$GITHUB_SHA"
          git push origin HEAD:integration/chme3-assistant

      - name: Explain canonical build handoff
        run: |
          echo 'Production-source commit pushed.'
          echo 'chme3-assistant-signed will now materialize RailBrakeCalculator.zip + patch/, run unit tests, and build the signed Test app.'
