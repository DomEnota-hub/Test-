name: Temporary assistant v0.14 visibility fix

on:
  push:
    branches:
      - feature/offline-assistant-v0.9
    paths:
      - .github/workflows/assistant-v014-coverage-temp.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-assistant-v0.9
          fetch-depth: 0
      - name: Fix adapter visibility in both mirrors
        shell: bash
        run: |
          set -euo pipefail
          for path in app/src/main/java/ru/railbrake/calculator/core/assistant/AssistantAdapters.kt patch/app/src/main/java/ru/railbrake/calculator/core/assistant/AssistantAdapters.kt; do
            python3 - "$path" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          old = 'object FirstAidAssistantAdapter {'
          new = 'internal object FirstAidAssistantAdapter {'
          if text.count(old) != 1:
              raise SystemExit(f'{path}: visibility marker count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          done
          cmp app/src/main/java/ru/railbrake/calculator/core/assistant/AssistantAdapters.kt patch/app/src/main/java/ru/railbrake/calculator/core/assistant/AssistantAdapters.kt
          git diff --check
          git add app patch/app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep first-aid adapter internal'
          git push origin HEAD:feature/offline-assistant-v0.9
