name: Temporary assistant v0.14 coverage patch

on:
  push:
    branches:
      - feature/offline-assistant-v0.9
    paths:
      - .github/workflows/assistant-v014-coverage-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-assistant-v0.9
          fetch-depth: 0

      - name: Apply coverage, ID and slang changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('app'), Path('patch/app')]

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected marker once, got {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # AssistantModels: first-aid target + IDs become searchable.
          for root in roots:
              p = root / 'src/main/java/ru/railbrake/calculator/core/assistant/AssistantModels.kt'
              replace_once(p,
                  '    ERMAK_DIAGNOSTIC,\n    KNOWLEDGE_ARTICLE\n',
                  '    ERMAK_DIAGNOSTIC,\n    KNOWLEDGE_ARTICLE,\n    FIRST_AID\n')
              replace_once(p,
                  '    data class Knowledge(\n        val articleId: String\n    ) : AssistantTarget\n',
                  '    data class Knowledge(\n        val articleId: String\n    ) : AssistantTarget\n\n    data class FirstAid(\n        val topicId: String\n    ) : AssistantTarget\n')
              replace_once(p,
                  '        append(title)\n        append(\' \')\n        append(summary)\n',
                  '        append(canonicalId)\n        append(\' \')\n        append(key)\n        append(\' \')\n        append(title)\n        append(\' \')\n        append(summary)\n')
              replace_once(p,
                  '        append(tags.joinToString(" "))\n        append(\' \')\n        append(nativeSearchText)\n',
                  '        append(tags.joinToString(" "))\n        append(\' \')\n        append(relatedIds.joinToString(" "))\n        append(\' \')\n        append(nativeSearchText)\n')

          # FirstAidScreen: expose searchable source data and allow deep-linking to a topic.
          for root in roots:
              p = root / 'src/main/java/ru/railbrake/calculator/ui/FirstAidScreen.kt'
              replace_once(p, 'private val firstAidSearchKeywords = mapOf(', 'internal val firstAidSearchKeywords = mapOf(')
              replace_once(p, 'private val workerKitLines = listOf(', 'internal val workerKitLines = listOf(')
              replace_once(p,
                  'fun FirstAidScreen(onBack: () -> Unit) {\n    val context = LocalContext.current\n    var selectedId by rememberSaveable { mutableStateOf("unconscious") }',
                  'fun FirstAidScreen(onBack: () -> Unit, initialTopicId: String? = null) {\n    val context = LocalContext.current\n    var selectedId by rememberSaveable(initialTopicId) {\n        mutableStateOf(\n            initialTopicId?.takeIf { candidate ->\n                candidate == "kit" || firstAidTopics.any { it.id == candidate }\n            } ?: "unconscious"\n        )\n    }')

          # Adapter for first-aid topics.
          first_aid_adapter = r'''

object FirstAidAssistantAdapter {
    fun adapt(topic: FirstAidTopic): AssistantDocument = AssistantDocument(
        key = "first-aid:${topic.id}",
        canonicalId = topic.id,
        kind = AssistantDocumentKind.FIRST_AID,
        family = null,
        section = TechnicalSection.SAFETY,
        title = topic.title,
        summary = topic.whenToUse.firstOrNull().orEmpty(),
        body = buildList {
            addAll(topic.whenToUse)
            addAll(topic.actions)
            addAll(topic.dont)
            topic.note?.let(::add)
            add(topic.source)
        }.joinToString(" "),
        aliases = buildSet {
            add(topic.title)
            addAll(topic.whenToUse)
            addAll(firstAidSearchKeywords[topic.id].orEmpty())
        },
        componentIds = emptySet(),
        symptomTerms = topic.whenToUse.toSet(),
        tags = setOf("первая помощь", "оказание первой помощи", "опп"),
        relatedIds = emptySet(),
        safetyCritical = true,
        target = AssistantTarget.FirstAid(topic.id),
        nativeSearchText = firstAidSearchKeywords[topic.id].orEmpty().joinToString(" ")
    )
}
'''
          for root in roots:
              p = root / 'src/main/java/ru/railbrake/calculator/core/assistant/AssistantAdapters.kt'
              text = p.read_text(encoding='utf-8')
              if 'import ru.railbrake.calculator.ui.FirstAidTopic' not in text:
                  text = text.replace(
                      'import ru.railbrake.calculator.core.TechnicalSection\n',
                      'import ru.railbrake.calculator.core.TechnicalSection\nimport ru.railbrake.calculator.ui.FirstAidTopic\nimport ru.railbrake.calculator.ui.firstAidSearchKeywords\n',
                      1,
                  )
              if 'object FirstAidAssistantAdapter' in text:
                  raise SystemExit(f'{p}: adapter already exists')
              p.write_text(text.rstrip() + first_aid_adapter + '\n', encoding='utf-8')

          # Loader: include OPP topics + worker first-aid kit.
          for root in roots:
              p = root / 'src/main/java/ru/railbrake/calculator/core/assistant/AssistantContentLoader.kt'
              text = p.read_text(encoding='utf-8')
              text = text.replace(
                  'import ru.railbrake.calculator.core.TechnicalSection\n',
                  'import ru.railbrake.calculator.core.TechnicalSection\nimport ru.railbrake.calculator.ui.firstAidTopics\nimport ru.railbrake.calculator.ui.workerKitLines\n',
                  1,
              )
              marker = '''        val knowledge = KnowledgeRepository.articles
            .map(KnowledgeArticleAssistantAdapter::adapt)

        return (technical + vl80Diagnostics + ermakDiagnostics + knowledge)
            .distinctBy(AssistantDocument::key)
'''
              replacement = '''        val knowledge = KnowledgeRepository.articles
            .map(KnowledgeArticleAssistantAdapter::adapt)

        val firstAid = firstAidTopics.map(FirstAidAssistantAdapter::adapt)
        val firstAidKit = AssistantDocument(
            key = "first-aid:kit",
            canonicalId = "kit",
            kind = AssistantDocumentKind.FIRST_AID,
            family = null,
            section = TechnicalSection.SAFETY,
            title = "Аптечка работника",
            summary = "Состав аптечки и средства первой помощи",
            body = workerKitLines.joinToString(" "),
            aliases = setOf("аптечка", "аптечка работника", "жгут", "бинт", "перчатки", "салфетки"),
            componentIds = emptySet(),
            symptomTerms = emptySet(),
            tags = setOf("первая помощь", "оказание первой помощи", "опп"),
            relatedIds = emptySet(),
            safetyCritical = true,
            target = AssistantTarget.FirstAid("kit")
        )

        return (technical + vl80Diagnostics + ermakDiagnostics + knowledge + firstAid + firstAidKit)
            .distinctBy(AssistantDocument::key)
'''
              if text.count(marker) != 1:
                  raise SystemExit(f'{p}: loader marker mismatch')
              p.write_text(text.replace(marker, replacement, 1), encoding='utf-8')

          # Index: direct canonical/related/component IDs get deterministic priority.
          for root in roots:
              p = root / 'src/main/java/ru/railbrake/calculator/core/assistant/AssistantIndex.kt'
              replace_once(p,
                  '            val reasons = mutableListOf<String>()\n\n            if (query.isNotBlank() && query in document.searchText) {',
                  '''            val reasons = mutableListOf<String>()

            val canonicalId = document.canonicalId.normalizeAssistantText()
            val directCanonicalId = canonicalId.isNotBlank() &&
                (query == canonicalId || query.split(' ').contains(canonicalId) ||
                    (canonicalId.length >= 5 && query.contains(canonicalId)))
            if (directCanonicalId) {
                score += 180
                hasContentEvidence = true
                reasons += "canonical-id"
            }

            val linkedId = (document.relatedIds + document.componentIds)
                .asSequence()
                .map(String::normalizeAssistantText)
                .filter(String::isNotBlank)
                .firstOrNull { candidate ->
                    query == candidate || query.split(' ').contains(candidate) ||
                        (candidate.length >= 5 && query.contains(candidate))
                }
            if (linkedId != null) {
                score += 90
                hasContentEvidence = true
                reasons += "linked-id"
            }

            if (query.isNotBlank() && query in document.searchText) {''')
              replace_once(p,
                  '            "где", "покажи", "найди", "открой", "про", "при", "это", "он", "она"\n',
                  '            "где", "покажи", "найди", "открой", "про", "при", "это", "он", "она",\n            "id", "ид", "айди", "карточка", "карточку", "сценарий", "сценария"\n')

          # Parser: conservative railway slang + first-aid phrases + preserve ID punctuation.
          for root in roots:
              p = root / 'src/main/java/ru/railbrake/calculator/core/assistant/AssistantQueryParser.kt'
              replace_once(p,
                  '        "главник" to "главный выключатель",\n',
                  '''        "главник" to "главный выключатель",
        "групповик" to "групповой переключатель",
        "фазник" to "фазорасщепитель",
        "машинистский кран" to "кран машиниста",
        "кран триста девяносто пять" to "км 395",
        "кран 395" to "км 395",
        "не пашет" to "не работает",
        "не фурычит" to "не работает",
        "вырубился" to "самопроизвольно отключился",
        "вырубило" to "самопроизвольно отключило",
        "отрубился" to "самопроизвольно отключился",
        "отвалился" to "самопроизвольно отключился",
        "залипает" to "заклинивает",
        "залип" to "заклинил",
        "сифонит" to "утечка воздуха",
        "травит" to "утечка",
''')
              replace_once(p,
                  '        ComponentVocabulary("COMPRESSOR", listOf("компрессор", "мк"), "компрессор мотор-компрессор мк"),\n',
                  '        ComponentVocabulary("COMPRESSOR", listOf("компрессор", "мотор-компрессор", "мотор компрессор", "мк"), "компрессор мотор-компрессор мк"),\n')
              replace_once(p,
                  '        ComponentVocabulary("EKG", listOf("экг", "групповой переключатель"), "экг групповой переключатель"),\n',
                  '        ComponentVocabulary("EKG", listOf("экг", "групповой переключатель", "групповик"), "экг групповой переключатель группповик"),\n')
              replace_once(p,
                  '        ComponentVocabulary("PHASE_SPLITTER", listOf("фазорасщепитель", "расщепитель фаз"), "фазорасщепитель расщепитель фаз"),\n',
                  '        ComponentVocabulary("PHASE_SPLITTER", listOf("фазорасщепитель", "расщепитель фаз", "фазник"), "фазорасщепитель расщепитель фаз фазник"),\n')
              replace_once(p,
                  '        ComponentVocabulary("AIR_DISTRIBUTOR", listOf("воздухораспределитель", "вр 483", "вр483"), "воздухораспределитель вр 483"),\n',
                  '        ComponentVocabulary("AIR_DISTRIBUTOR", listOf("воздухораспределитель", "вр 483", "вр483", "вр", "483"), "воздухораспределитель вр 483"),\n')
              replace_once(p,
                  '        ComponentVocabulary("DRIVER_BRAKE_VALVE", listOf("кран машиниста", "км 395", "км395"), "кран машиниста км 395"),\n',
                  '        ComponentVocabulary("DRIVER_BRAKE_VALVE", listOf("кран машиниста", "машинистский кран", "км 395", "км395", "395"), "кран машиниста км 395"),\n')
              replace_once(p,
                  '        "самопроизвольно", "сам включ", "сам выключ", "мигает", "моргает", "горит постоянно"\n',
                  '        "самопроизвольно", "сам включ", "сам выключ", "мигает", "моргает", "горит постоянно",\n        "глюч", "косяч", "выруб", "отруб", "отвал", "залип", "трав", "сифон",\n        "не останавлива", "пахнет гарью", "гарь", "трещит", "дребезжит", "воет", "свистит"\n')
              replace_once(p,
                  '.replace(Regex("[^\\\\p{L}\\\\p{N}\\\\s-]"), " ")',
                  '.replace(Regex("[^\\\\p{L}\\\\p{N}\\\\s_:-]"), " ")')
              replace_once(p,
                  '        listOf("охрана труда", "безопасность", "переохлаж", "обморож", "первая помощь").any(text::contains)\n',
                  '''        listOf(
            "охрана труда", "безопасность", "первая помощь", "опп", "переохлаж", "обморож",
            "слр", "реанимац", "без сознания", "не дышит", "кровотеч", "подавил", "ожог",
            "удар током", "электроудар", "отрав", "перелом", "судорог", "укус", "тепловой удар",
            "замерз", "обмороз", "аптеч"
        ).any(text::contains)
''')

          # Result activity: first-aid deep link.
          for root in roots:
              p = root / 'src/main/java/ru/railbrake/calculator/ui/AssistantResultActivity.kt'
              replace_once(p,
                  '            KIND_KNOWLEDGE -> {\n                KnowledgeBaseScreen(',
                  '''            KIND_FIRST_AID -> {
                FirstAidScreen(
                    onBack = { finish() },
                    initialTopicId = id
                )
            }

            KIND_KNOWLEDGE -> {
                KnowledgeBaseScreen(''')
              replace_once(p,
                  '        private const val KIND_KNOWLEDGE = "knowledge"\n',
                  '        private const val KIND_KNOWLEDGE = "knowledge"\n        private const val KIND_FIRST_AID = "first_aid"\n')
              replace_once(p,
                  '                    is AssistantTarget.Knowledge -> {\n                        putExtra(EXTRA_KIND, KIND_KNOWLEDGE)\n                        putExtra(EXTRA_ID, target.articleId)\n                    }\n',
                  '''                    is AssistantTarget.Knowledge -> {
                        putExtra(EXTRA_KIND, KIND_KNOWLEDGE)
                        putExtra(EXTRA_ID, target.articleId)
                    }

                    is AssistantTarget.FirstAid -> {
                        putExtra(EXTRA_KIND, KIND_FIRST_AID)
                        putExtra(EXTRA_ID, target.topicId)
                    }
''')

          # Regression tests: direct IDs, slang and first-aid indexing target.
          test_addition = r'''

    @Test
    fun directCanonicalIdReferenceWinsEvenWithConversationalWrapper() {
        val result = engine().query("открой ID vl80-gv-fault")

        assertTrue(result is AssistantEngineResult.Matches)
        result as AssistantEngineResult.Matches
        assertEquals("vl80-gv-fault", result.hits.first().document.canonicalId)
        assertTrue("canonical-id" in result.hits.first().reasons)
    }

    @Test
    fun conversationalRailwaySlangNormalizesToFaultIntent() {
        val cases = mapOf(
            "групповик залип" to "EKG",
            "фазник не пашет" to "PHASE_SPLITTER",
            "кран 395 травит" to "DRIVER_BRAKE_VALVE",
            "мотор компрессор сифонит" to "COMPRESSOR"
        )

        cases.forEach { (query, component) ->
            val parsed = AssistantQueryParser.parse(query)
            assertEquals("Wrong component for: $query", component, parsed.componentKey)
            assertEquals("Wrong intent for: $query", AssistantIntent.TROUBLESHOOT, parsed.intent)
        }
    }

    @Test
    fun firstAidWordingIsRecognizedAsSafetyIntent() {
        val queries = listOf(
            "человека ударило током",
            "что делать если подавился",
            "нужна слр",
            "обморозил пальцы",
            "что должно быть в аптечке"
        )
        queries.forEach { query ->
            assertEquals("Wrong intent for: $query", AssistantIntent.SAFETY, AssistantQueryParser.parse(query).intent)
        }
    }
'''
          for root in roots:
              p = root / 'src/test/java/ru/railbrake/calculator/core/assistant/AssistantEngineTest.kt'
              text = p.read_text(encoding='utf-8')
              marker = '\n    private fun engine(): AssistantEngine = AssistantEngine('
              if marker not in text:
                  raise SystemExit(f'{p}: engine marker missing')
              if 'directCanonicalIdReferenceWinsEvenWithConversationalWrapper' in text:
                  raise SystemExit(f'{p}: tests already added')
              p.write_text(text.replace(marker, test_addition + marker, 1), encoding='utf-8')

          adapter_test = r'''package ru.railbrake.calculator.core.assistant

import org.junit.Assert.assertEquals
import org.junit.Assert.assertTrue
import org.junit.Test
import ru.railbrake.calculator.ui.firstAidTopics

class FirstAidAssistantAdapterTest {
    @Test
    fun frostbiteTopicIsProjectedAsFirstAidDocument() {
        val topic = firstAidTopics.first { it.id == "frostbite" }
        val document = FirstAidAssistantAdapter.adapt(topic)

        assertEquals(AssistantDocumentKind.FIRST_AID, document.kind)
        assertEquals("frostbite", document.canonicalId)
        assertEquals(AssistantTarget.FirstAid("frostbite"), document.target)
        assertTrue("обморожение" in document.searchText)
        assertTrue("первая помощь" in document.searchText)
    }
}
'''
          for root in roots:
              p = root / 'src/test/java/ru/railbrake/calculator/core/assistant/FirstAidAssistantAdapterTest.kt'
              if p.exists():
                  raise SystemExit(f'{p}: already exists')
              p.write_text(adapter_test, encoding='utf-8')

          # Mirrors must remain byte-for-byte aligned for all changed mirrored files.
          mirrored = [
              'src/main/java/ru/railbrake/calculator/core/assistant/AssistantModels.kt',
              'src/main/java/ru/railbrake/calculator/core/assistant/AssistantAdapters.kt',
              'src/main/java/ru/railbrake/calculator/core/assistant/AssistantContentLoader.kt',
              'src/main/java/ru/railbrake/calculator/core/assistant/AssistantIndex.kt',
              'src/main/java/ru/railbrake/calculator/core/assistant/AssistantQueryParser.kt',
              'src/main/java/ru/railbrake/calculator/ui/AssistantResultActivity.kt',
              'src/main/java/ru/railbrake/calculator/ui/FirstAidScreen.kt',
              'src/test/java/ru/railbrake/calculator/core/assistant/AssistantEngineTest.kt',
              'src/test/java/ru/railbrake/calculator/core/assistant/FirstAidAssistantAdapterTest.kt',
          ]
          for rel in mirrored:
              a = (Path('app') / rel).read_bytes()
              b = (Path('patch/app') / rel).read_bytes()
              if a != b:
                  raise SystemExit(f'mirror mismatch: {rel}')
          PY

          git diff --check
          git status --short
          git add app patch/app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: expand assistant slang IDs and first-aid coverage'
          git push origin HEAD:feature/offline-assistant-v0.9
