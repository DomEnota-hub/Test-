name: Temporary assistant v0.14 validation

on:
  push:
    branches:
      - feature/offline-assistant-v0.9
    paths:
      - .github/workflows/assistant-v014-coverage-temp.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-assistant-v0.9
          fetch-depth: 0

      - name: Verify changed source mirrors
        shell: bash
        run: |
          set -euo pipefail
          for file in AssistantModels.kt AssistantAdapters.kt AssistantContentLoader.kt AssistantIndex.kt AssistantQueryModels.kt AssistantQueryParser.kt AssistantEngine.kt AssistantRuntime.kt; do
            cmp "app/src/main/java/ru/railbrake/calculator/core/assistant/$file" "patch/app/src/main/java/ru/railbrake/calculator/core/assistant/$file"
          done
          cmp app/src/main/java/ru/railbrake/calculator/ui/AssistantResultActivity.kt patch/app/src/main/java/ru/railbrake/calculator/ui/AssistantResultActivity.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/FirstAidScreen.kt patch/app/src/main/java/ru/railbrake/calculator/ui/FirstAidScreen.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/assistant/AssistantEngineTest.kt patch/app/src/test/java/ru/railbrake/calculator/core/assistant/AssistantEngineTest.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/assistant/AssistantIndexTest.kt patch/app/src/test/java/ru/railbrake/calculator/core/assistant/AssistantIndexTest.kt
          cmp app/src/test/java/ru/railbrake/calculator/core/assistant/FirstAidAssistantAdapterTest.kt patch/app/src/test/java/ru/railbrake/calculator/core/assistant/FirstAidAssistantAdapterTest.kt
          git diff --check HEAD~1 HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract current application source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/

      - name: Run unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Build debug APK
        working-directory: buildsrc/RailBrakeCalculator
        run: timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain
