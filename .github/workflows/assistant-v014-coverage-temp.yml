name: Temporary assistant v0.14 coverage patch

on:
  push:
    branches:
      - feature/offline-assistant-v0.9
    paths:
      - .github/workflows/assistant-v014-coverage-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-assistant-v0.9
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_assistant_v014_coverage.py

      - name: Normalize text endings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('app/src/main/java/ru/railbrake/calculator/core/assistant/AssistantAdapters.kt'),
              Path('patch/app/src/main/java/ru/railbrake/calculator/core/assistant/AssistantAdapters.kt'),
          ]:
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          set -euo pipefail
          git diff --check
          git add app patch/app
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: expand assistant slang IDs and first-aid coverage'
          git push origin HEAD:feature/offline-assistant-v0.9
