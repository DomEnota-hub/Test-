name: Offline Assistant v0.15 CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/offline-assistant-v0.9
    paths:
      - app/src/main/java/ru/railbrake/calculator/core/assistant/**
      - patch/app/src/main/java/ru/railbrake/calculator/core/assistant/**
      - app/src/main/java/ru/railbrake/calculator/ui/AssistantHomePanel.kt
      - patch/app/src/main/java/ru/railbrake/calculator/ui/AssistantHomePanel.kt
      - app/src/main/java/ru/railbrake/calculator/ui/AssistantResultActivity.kt
      - patch/app/src/main/java/ru/railbrake/calculator/ui/AssistantResultActivity.kt
      - app/src/main/java/ru/railbrake/calculator/ui/HomeScreen.kt
      - patch/app/src/main/java/ru/railbrake/calculator/ui/HomeScreen.kt
      - patch/app/src/main/AndroidManifest.xml
      - app/src/test/java/ru/railbrake/calculator/core/assistant/**
      - patch/app/src/test/java/ru/railbrake/calculator/core/assistant/**
      - .github/workflows/offline-assistant-v0.9-ci.yml
  pull_request:
    branches:
      - dev14-integration
    paths:
      - app/src/main/java/ru/railbrake/calculator/core/assistant/**
      - patch/app/src/main/java/ru/railbrake/calculator/core/assistant/**
      - app/src/main/java/ru/railbrake/calculator/ui/AssistantHomePanel.kt
      - patch/app/src/main/java/ru/railbrake/calculator/ui/AssistantHomePanel.kt
      - app/src/main/java/ru/railbrake/calculator/ui/AssistantResultActivity.kt
      - patch/app/src/main/java/ru/railbrake/calculator/ui/AssistantResultActivity.kt
      - app/src/main/java/ru/railbrake/calculator/ui/HomeScreen.kt
      - patch/app/src/main/java/ru/railbrake/calculator/ui/HomeScreen.kt
      - patch/app/src/main/AndroidManifest.xml
      - app/src/test/java/ru/railbrake/calculator/core/assistant/**
      - patch/app/src/test/java/ru/railbrake/calculator/core/assistant/**
      - .github/workflows/offline-assistant-v0.9-ci.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RAILBRAKE_KEYSTORE_BASE64 }}
      EXPECTED_SIGNING_CERT_SHA256: ea9fe9341a6ba72b585bd7ff82ce29c8fc5b7b59e76b8b134df203eaab8e2788

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify assistant source mirrors
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            AssistantModels.kt \
            AssistantAdapters.kt \
            AssistantContentLoader.kt \
            AssistantIndex.kt \
            AssistantQueryModels.kt \
            AssistantQueryParser.kt \
            AssistantFailureMode.kt \
            AssistantEngine.kt \
            AssistantRuntime.kt; do
            cmp "app/src/main/java/ru/railbrake/calculator/core/assistant/$file" \
                "patch/app/src/main/java/ru/railbrake/calculator/core/assistant/$file"
          done
          for file in AssistantHomePanel.kt AssistantResultActivity.kt HomeScreen.kt; do
            cmp "app/src/main/java/ru/railbrake/calculator/ui/$file" \
                "patch/app/src/main/java/ru/railbrake/calculator/ui/$file"
          done
          for testfile in \
            AssistantIndexTest.kt \
            AssistantEngineTest.kt \
            AssistantClarificationResolutionTest.kt \
            AssistantDiagnosticCorpusTest.kt \
            AssistantHumanQueryCorpusTest.kt; do
            cmp \
              "app/src/test/java/ru/railbrake/calculator/core/assistant/$testfile" \
              "patch/app/src/test/java/ru/railbrake/calculator/core/assistant/$testfile"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract dev13 base and overlay dev14 plus assistant
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/
          for file in \
            AssistantModels.kt \
            AssistantAdapters.kt \
            AssistantContentLoader.kt \
            AssistantIndex.kt \
            AssistantQueryModels.kt \
            AssistantQueryParser.kt \
            AssistantFailureMode.kt \
            AssistantEngine.kt \
            AssistantRuntime.kt; do
            test -f "buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/core/assistant/$file"
          done
          test -f buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/ui/AssistantHomePanel.kt
          test -f buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/ui/AssistantResultActivity.kt
          test -f buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/ui/HomeScreen.kt
          grep -q 'AssistantResultActivity' buildsrc/RailBrakeCalculator/app/src/main/AndroidManifest.xml
          for testfile in \
            AssistantIndexTest.kt \
            AssistantEngineTest.kt \
            AssistantClarificationResolutionTest.kt \
            AssistantDiagnosticCorpusTest.kt \
            AssistantHumanQueryCorpusTest.kt; do
            test -f "buildsrc/RailBrakeCalculator/app/src/test/java/ru/railbrake/calculator/core/assistant/$testfile"
          done

      - name: Prepare updatable Test application
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path('buildsrc/RailBrakeCalculator')
          gradle = project / 'app/build.gradle.kts'
          text = gradle.read_text(encoding='utf-8')

          text, app_id_count = re.subn(
              r'applicationId\s*=\s*"ru\.railbrake\.calculator"',
              'applicationId = "ru.railbrake.calculator.assistanttest"',
              text,
              count=1,
          )
          if app_id_count != 1:
              raise SystemExit('Expected applicationId was not found exactly once')

          text, code_count = re.subn(
              r'versionCode\s*=\s*\d+',
              'versionCode = 202',
              text,
              count=1,
          )
          if code_count != 1:
              raise SystemExit('Expected versionCode was not found exactly once')

          def version_replacement(match):
              return f'versionName = "{match.group(1)}-assistant-v0.15"'

          text, version_count = re.subn(
              r'versionName\s*=\s*"([^"]+)"',
              version_replacement,
              text,
              count=1,
          )
          if version_count != 1:
              raise SystemExit('Expected versionName was not found exactly once')

          gradle.write_text(text, encoding='utf-8')

          strings = project / 'app/src/main/res/values/strings.xml'
          strings_text = strings.read_text(encoding='utf-8')
          marker = '<string name="app_name">ЖД Помощник</string>'
          if marker not in strings_text:
              raise SystemExit('Expected app_name was not found')
          strings.write_text(
              strings_text.replace(
                  marker,
                  '<string name="app_name">ЖД Помощник Test</string>',
                  1,
              ),
              encoding='utf-8',
          )
          PY

      - name: Compile and test debug sources
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=KILL 5m gradle --no-daemon :app:lintDebug --stacktrace --console=plain

      - name: Decode stable signing key
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed Test APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        env:
          RAILBRAKE_KEYSTORE_PATH: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/release.keystore
          RAILBRAKE_STORE_PASSWORD: ${{ secrets.RAILBRAKE_STORE_PASSWORD }}
          RAILBRAKE_KEY_ALIAS: ${{ secrets.RAILBRAKE_KEY_ALIAS }}
          RAILBRAKE_KEY_PASSWORD: ${{ secrets.RAILBRAKE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          timeout --signal=KILL 15m gradle :app:assembleRelease --stacktrace --console=plain

      - name: Verify signed Test APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee assistant-test-badging.log
          grep -Fq "package: name='ru.railbrake.calculator.assistanttest' versionCode='202' versionName='1.2.2-dev14-beta52-assistant-v0.15'" assistant-test-badging.log
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee assistant-test-apksigner.log
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNING_CERT_SHA256" assistant-test-apksigner.log

      - name: Upload updatable signed Test APK
        uses: actions/upload-artifact@v4
        with:
          name: railbrake-assistant-test-v0.15-signed-apk
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
