name: Offline Assistant v0.9 CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/offline-assistant-v0.9
    paths:
      - app/src/main/java/ru/railbrake/calculator/core/assistant/**
      - patch/app/src/main/java/ru/railbrake/calculator/core/assistant/**
      - app/src/test/java/ru/railbrake/calculator/core/assistant/**
      - patch/app/src/test/java/ru/railbrake/calculator/core/assistant/**
      - .github/workflows/offline-assistant-v0.9-ci.yml
  pull_request:
    branches:
      - dev14-integration
    paths:
      - app/src/main/java/ru/railbrake/calculator/core/assistant/**
      - patch/app/src/main/java/ru/railbrake/calculator/core/assistant/**
      - app/src/test/java/ru/railbrake/calculator/core/assistant/**
      - patch/app/src/test/java/ru/railbrake/calculator/core/assistant/**
      - .github/workflows/offline-assistant-v0.9-ci.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify assistant source mirrors
        shell: bash
        run: |
          set -euo pipefail
          for file in AssistantModels.kt AssistantAdapters.kt AssistantContentLoader.kt AssistantIndex.kt; do
            cmp "app/src/main/java/ru/railbrake/calculator/core/assistant/$file" \
                "patch/app/src/main/java/ru/railbrake/calculator/core/assistant/$file"
          done
          cmp \
            app/src/test/java/ru/railbrake/calculator/core/assistant/AssistantIndexTest.kt \
            patch/app/src/test/java/ru/railbrake/calculator/core/assistant/AssistantIndexTest.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract dev13 base and overlay dev14 plus assistant
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/
          for file in AssistantModels.kt AssistantAdapters.kt AssistantContentLoader.kt AssistantIndex.kt; do
            test -f "buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/core/assistant/$file"
          done
          test -f buildsrc/RailBrakeCalculator/app/src/test/java/ru/railbrake/calculator/core/assistant/AssistantIndexTest.kt

      - name: Compile and test debug sources
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain

      - name: Android lint
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain

      - name: Build debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain
