name: Export assistant source for ChatGPT

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-assistant-source-for-chatgpt.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact assistant source
        uses: actions/checkout@v4
        with:
          ref: d2b51d299555022fb0c7776378540b36a0a34570
          fetch-depth: 1

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          zip -qr Test-offline-assistant-v0.9-source.zip . -x '.git/*' -x 'Test-offline-assistant-v0.9-source.zip'
          unzip -t Test-offline-assistant-v0.9-source.zip >/dev/null
          sha256sum Test-offline-assistant-v0.9-source.zip

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: Test-offline-assistant-v0.9-source
          path: Test-offline-assistant-v0.9-source.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
