name: Apply Package A navigation architecture v3

on:
  push:
    branches:
      - integration/chme3-assistant
    paths:
      - '.github/workflows/apply-package-a-navigation-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/chme3-assistant
          test "$(git rev-parse origin/integration/chme3-assistant)" = "$GITHUB_SHA"

      - name: Execute corrected v2 patch body
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-package-a-navigation-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(body)
          bad = "if (roots[0].joinpath(rel).read_text() != roots[1].joinpath(rel).read_text():"
          good = "if roots[0].joinpath(rel).read_text() != roots[1].joinpath(rel).read_text():"
          if bad not in script:
              raise SystemExit('expected v2 syntax typo was not found')
          script = script.replace(bad, good, 1)
          exec(compile(script, 'package-a-v2-fixed.py', 'exec'))
          PY
          git diff --check

      - name: Compile and unit test
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --no-daemon

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git add app/src/main/java patch/app/src/main/java
          git diff --cached --check
          git config user.name "DomEnota-hub"
          git config user.email "domenota6212@gmail.com"
          git commit -m "feat: centralize locomotive viewing context"
          git fetch origin integration/chme3-assistant
          test "$(git rev-parse origin/integration/chme3-assistant)" = "$GITHUB_SHA"
          git push origin HEAD:integration/chme3-assistant
