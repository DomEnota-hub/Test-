name: Export current working source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-working-source.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Package repository source
        shell: bash
        run: |
          tar --exclude=.git -czf /tmp/railbrake-current-source.tar.gz .
          mv /tmp/railbrake-current-source.tar.gz .
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: railbrake-current-source
          path: railbrake-current-source.tar.gz
          if-no-files-found: error
          retention-days: 1
