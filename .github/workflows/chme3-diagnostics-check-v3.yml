name: ChME3 diagnostics check v3

on:
  push:
    branches:
      - feature/locomotive-knowledge-foundation
    paths:
      - 'docs/locomotives/chme3/diagnostic_source_registry_addendum.json'
      - 'docs/locomotives/chme3/diagnostics_*_pass3.json'
      - 'docs/locomotives/chme3/search_vocabulary_diagnostics*_pass3.json'
      - 'docs/locomotives/chme3/atlas_index*.json'
      - 'docs/locomotives/chme3/atlas_cards_*.json'
      - 'qa/validate_chme3_diagnostics_v3.py'
      - '.github/workflows/chme3-diagnostics-check-v3.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate full ChME3 diagnostics pass 3
        run: python qa/validate_chme3_diagnostics_v3.py
