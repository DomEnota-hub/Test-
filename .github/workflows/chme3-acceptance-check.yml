name: ChME3 acceptance check

on:
  push:
    branches:
      - feature/locomotive-knowledge-foundation
    paths:
      - 'docs/locomotives/chme3/acceptance_*.json'
      - 'docs/locomotives/chme3/atlas_index*.json'
      - 'docs/locomotives/chme3/diagnostics_*_pass3.json'
      - 'docs/locomotives/chme3/*source_registry*.json'
      - 'qa/validate_chme3_acceptance.py'
      - '.github/workflows/chme3-acceptance-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ChME3 acceptance package
        run: python qa/validate_chme3_acceptance.py
