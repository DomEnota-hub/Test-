name: Apply expanded emergency settings UI

on:
  push:
    branches:
      - feature/extended-emergency-scenarios
    paths:
      - '.github/workflows/apply-extended-emergency-settings.yml'
      - 'qa/validate_extended_emergency_architecture.py'
      - 'app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt'
      - 'patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt'
      - 'app/src/main/java/ru/railbrake/calculator/ui/ExtendedEmergencySettingsSection.kt'
      - 'patch/app/src/main/java/ru/railbrake/calculator/ui/ExtendedEmergencySettingsSection.kt'
      - 'app/src/main/java/ru/railbrake/calculator/data/ExtendedEmergencyModeRepository.kt'
      - 'patch/app/src/main/java/ru/railbrake/calculator/data/ExtendedEmergencyModeRepository.kt'
      - 'app/src/main/java/ru/railbrake/calculator/ui/theme/Color.kt'
      - 'patch/app/src/main/java/ru/railbrake/calculator/ui/theme/Color.kt'
      - 'app/src/main/java/ru/railbrake/calculator/ui/theme/Theme.kt'
      - 'patch/app/src/main/java/ru/railbrake/calculator/ui/theme/Theme.kt'
      - 'app/src/main/assets/technical/extended_emergency_policy.json'
      - 'patch/app/src/main/assets/technical/extended_emergency_policy.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/extended-emergency-scenarios
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Patch settings screen labels and section in app and patch mirrors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt'),
              Path('patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt'),
          ]
          for p in paths:
              text = p.read_text(encoding='utf-8')
              replacements = [
                  ('SETTINGS("Палитра")', 'SETTINGS("Настройки")', 1),
                  ('label = { Text("Палитра") },', 'label = { Text("Настройки") },', 1),
                  ('PaletteScreen(palette, onPaletteChange, themeMode, onThemeModeChange)', 'SettingsScreen(palette, onPaletteChange, themeMode, onThemeModeChange)', 1),
                  ('private fun PaletteScreen(', 'private fun SettingsScreen(', 1),
              ]
              for old, new, expected in replacements:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{p}: expected {expected} occurrence(s) of {old!r}, got {count}')
                  text = text.replace(old, new)
              anchor = '    RailInfoBand("Тема и цветовой акцент настраиваются независимо. Красный по-прежнему зарезервирован для опасности и ОПП.")'
              if text.count(anchor) != 1:
                  raise SystemExit(f'{p}: settings insertion anchor drifted')
              text = text.replace(anchor, '    ExtendedEmergencySettingsSection()\n' + anchor)
              if 'Палитра' in text:
                  raise SystemExit(f'{p}: stale user-facing Палитра label remains')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Verify expanded emergency architecture and mirrors
        run: python3 qa/validate_extended_emergency_architecture.py
      - name: Extract base project and overlay patch
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/
      - name: Prepare source-only UI validation build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('buildsrc/RailBrakeCalculator')
          gradle = root / 'app/build.gradle.kts'
          text = gradle.read_text(encoding='utf-8')
          dependency = '    implementation(files("libs/sherpa-onnx.aar"))\n'
          if text.count(dependency) != 1:
              raise SystemExit('Expected exactly one local sherpa-onnx dependency')
          gradle.write_text(text.replace(dependency, ''), encoding='utf-8')

          # The offline ASR AAR is an external binary and is intentionally not
          # stored in this repository/zip. Replace only its adapter in the
          # temporary build tree so the settings/UI change can still receive a
          # real Kotlin compile and unit-test pass. Repository sources remain
          # untouched; full runtime/release validation still requires the AAR.
          voice = root / 'app/src/main/java/ru/railbrake/calculator/core/assistant/AssistantVoiceInput.kt'
          if not voice.is_file():
              raise SystemExit('AssistantVoiceInput.kt missing from temporary build')
          voice.write_text('''package ru.railbrake.calculator.core.assistant\n\nimport android.content.Context\n\ninternal enum class AssistantVoicePhase { PREPARING, LISTENING, TRANSCRIBING }\n\ninternal sealed interface AssistantVoiceOutcome {\n    data class Transcript(val text: String) : AssistantVoiceOutcome\n    data object NoSpeech : AssistantVoiceOutcome\n}\n\ninternal class AssistantVoiceInput(private val context: Context) {\n    fun stop() = Unit\n    fun close() = Unit\n    suspend fun capture(onPhase: suspend (AssistantVoicePhase) -> Unit): AssistantVoiceOutcome {\n        onPhase(AssistantVoicePhase.PREPARING)\n        return AssistantVoiceOutcome.NoSpeech\n    }\n}\n''', encoding='utf-8')
          PY
      - name: Kotlin compile (UI source validation)
        working-directory: buildsrc/RailBrakeCalculator
        run: gradle :app:compileDebugKotlin --stacktrace --console=plain
      - name: Unit tests (UI source validation)
        working-directory: buildsrc/RailBrakeCalculator
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain
      - name: Patch hygiene
        run: git diff --check
      - name: Commit verified settings integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          git diff --cached --quiet && exit 0
          git commit -m 'feat: rename Palette to Settings and expose expanded emergency toggle'
          git pull --rebase origin feature/extended-emergency-scenarios
          git push origin HEAD:feature/extended-emergency-scenarios
