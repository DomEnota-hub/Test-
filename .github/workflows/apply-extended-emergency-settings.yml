name: Apply expanded emergency settings UI

on:
  push:
    branches:
      - feature/extended-emergency-scenarios
    paths:
      - '.github/workflows/apply-extended-emergency-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/extended-emergency-scenarios
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Patch settings screen labels and section in app and patch mirrors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt'),
              Path('patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt'),
          ]
          for p in paths:
              text = p.read_text(encoding='utf-8')
              replacements = [
                  ('SETTINGS("Палитра")', 'SETTINGS("Настройки")', 1),
                  ('label = { Text("Палитра") },', 'label = { Text("Настройки") },', 1),
                  ('PaletteScreen(palette, onPaletteChange, themeMode, onThemeModeChange)', 'SettingsScreen(palette, onPaletteChange, themeMode, onThemeModeChange)', 1),
                  ('private fun PaletteScreen(', 'private fun SettingsScreen(', 1),
              ]
              for old, new, expected in replacements:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{p}: expected {expected} occurrence(s) of {old!r}, got {count}')
                  text = text.replace(old, new)
              anchor = '    RailInfoBand("Тема и цветовой акцент настраиваются независимо. Красный по-прежнему зарезервирован для опасности и ОПП.")'
              if text.count(anchor) != 1:
                  raise SystemExit(f'{p}: settings insertion anchor drifted')
              text = text.replace(anchor, '    ExtendedEmergencySettingsSection()\n' + anchor)
              if 'Палитра' in text:
                  raise SystemExit(f'{p}: stale user-facing Палитра label remains')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Verify app and patch mirrors
        run: |
          cmp app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/ExtendedEmergencySettingsSection.kt patch/app/src/main/java/ru/railbrake/calculator/ui/ExtendedEmergencySettingsSection.kt
          cmp app/src/main/java/ru/railbrake/calculator/data/ExtendedEmergencyModeRepository.kt patch/app/src/main/java/ru/railbrake/calculator/data/ExtendedEmergencyModeRepository.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/theme/Color.kt patch/app/src/main/java/ru/railbrake/calculator/ui/theme/Color.kt
          cmp app/src/main/java/ru/railbrake/calculator/ui/theme/Theme.kt patch/app/src/main/java/ru/railbrake/calculator/ui/theme/Theme.kt
          cmp app/src/main/assets/technical/extended_emergency_policy.json patch/app/src/main/assets/technical/extended_emergency_policy.json
      - name: Extract base project and overlay patch
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/
      - name: Kotlin compile
        working-directory: buildsrc/RailBrakeCalculator
        run: gradle :app:compileDebugKotlin --stacktrace --console=plain
      - name: Unit tests
        working-directory: buildsrc/RailBrakeCalculator
        run: gradle :app:testDebugUnitTest --stacktrace --console=plain
      - name: Patch hygiene
        run: git diff --check
      - name: Commit verified settings integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt patch/app/src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt
          git diff --cached --quiet && exit 0
          git commit -m 'feat: rename Palette to Settings and expose expanded emergency toggle'
          git push origin HEAD:feature/extended-emergency-scenarios
