name: Apply dev7 source patch

on:
  push:
    branches: [ dev7-first-aid ]
    paths:
      - '.github/workflows/apply-dev7-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: dev7-first-aid

      - name: Apply prepared dev7 changes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .dev7-patch.b64 | gzip -d > /tmp/dev7.patch
          git apply -p1 /tmp/dev7.patch

          for rel in \
            build.gradle.kts \
            src/main/java/ru/railbrake/calculator/ui/BrakeCalculatorApp.kt \
            src/main/java/ru/railbrake/calculator/ui/DiagnosticScreen.kt \
            src/main/java/ru/railbrake/calculator/ui/ExamQuestionScreen.kt \
            src/main/java/ru/railbrake/calculator/ui/FirstAidScreen.kt \
            src/test/java/ru/railbrake/calculator/core/DiagnosticRepositoryTest.kt; do
            install -D -m 0644 "app/$rel" "patch/app/$rel"
          done

          git diff --check

      - name: Commit synchronized dev7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DomEnota-hub"
          git config user.email "domenota6212@gmail.com"
          git add README.md app patch
          git commit -m "Add first aid and responsive diagnostic feedback"
          git push origin HEAD:dev7-first-aid
