name: Temporary sync Beta into offline assistant

on:
  push:
    branches:
      - feature/offline-assistant-v0.9
    paths:
      - .github/workflows/sync-beta-into-assistant-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assistant branch
        uses: actions/checkout@v4
        with:
          ref: feature/offline-assistant-v0.9
          fetch-depth: 0

      - name: Apply validated Beta content without workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE="$(git rev-parse HEAD)"
          git remote add beta https://github.com/DomEnota-hub/Beta.git
          git fetch beta dev14-integration
          EXPECTED="a3c93873bd128d4769d004098981235c169fd085"
          ACTUAL="$(git rev-parse FETCH_HEAD)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Beta moved: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          git merge --squash FETCH_HEAD
          git checkout "$BASE" -- .github/workflows/dev14-safe-build-v2.yml
          git rm -f --ignore-unmatch .github/workflows/ermak-comprehensive-audit.yml .github/workflows/ermak-unknown-ux-hotfix.yml
          git add -A
          git commit -m "chore: sync Beta dev14-integration into assistant base"
          git push origin HEAD:feature/offline-assistant-v0.9
