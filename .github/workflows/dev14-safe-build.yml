name: Dev14 safe build

on:
  workflow_dispatch:
  push:
    branches:
      - dev14-integration
    paths:
      - app/**
      - patch/**
      - qa/**
      - RailBrakeCalculator.zip
      - .github/workflows/dev14-safe-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.RAILBRAKE_KEYSTORE_BASE64 }}
      EXPECTED_SIGNING_CERT_SHA256: ea9fe9341a6ba72b585bd7ff82ce29c8fc5b7b59e76b8b134df203eaab8e2788

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source mirrors and runtime asset strings
        shell: bash
        run: |
          set -euo pipefail
          cmp app/build.gradle.kts patch/app/build.gradle.kts
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          cmp app/src/main/java/ru/railbrake/calculator/core/TechnicalAssetReader.kt patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalAssetReader.kt
          expected=(
            ermak_diagnostics ermak_equipment ermak_knowledge ermak_links ermak_schemes ermak_system_map
            vl80s_acceptance vl80s_diagnostics vl80s_electrical vl80s_electrical_variants vl80s_equipment
            vl80s_pneumatic vl80s_pneumatic_variants vl80s_variants
          )
          for name in "${expected[@]}"; do
            test -f "app/src/main/assets/technical/${name}.json.gz"
            test -f "patch/app/src/main/assets/technical/${name}.json.gz"
            cmp "app/src/main/assets/technical/${name}.json.gz" "patch/app/src/main/assets/technical/${name}.json.gz"
          done
          grep -Fq 'val candidates = listOf(logicalName, "$logicalName.gz")' app/src/main/java/ru/railbrake/calculator/core/TechnicalAssetReader.kt
          grep -Fq 'firstByte == 0x1f && secondByte == 0x8b' app/src/main/java/ru/railbrake/calculator/core/TechnicalAssetReader.kt
          python3 qa/verify_runtime_asset_paths.py app/src/main/java app/src/main/assets | tee runtime-assets-source.log
          python3 -m py_compile qa/verify_runtime_asset_paths.py qa/verify_technical_assets_in_apk.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract dev13 base and overlay permanent dev14 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
          cp -a patch/. buildsrc/RailBrakeCalculator/
          cmp patch/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt buildsrc/RailBrakeCalculator/app/src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt
          cmp patch/app/build.gradle.kts buildsrc/RailBrakeCalculator/app/build.gradle.kts
          python3 qa/verify_runtime_asset_paths.py buildsrc/RailBrakeCalculator/app/src/main/java buildsrc/RailBrakeCalculator/app/src/main/assets | tee runtime-assets-overlay.log

      - name: Verify hotfix identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 144' buildsrc/RailBrakeCalculator/app/build.gradle.kts
          grep -Fq 'versionName = "1.2.2-dev14-hotfix2"' buildsrc/RailBrakeCalculator/app/build.gradle.kts

      - name: Run unit tests
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log

      - name: Run Android lint
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:lintDebug --stacktrace --console=plain 2>&1 | tee lint.log

      - name: Build debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build-debug.log

      - name: Verify debug APK runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/app-debug.apk
          python3 qa/verify_technical_assets_in_apk.py "$APK" | tee technical-assets-debug.log
          python3 qa/verify_runtime_asset_paths.py buildsrc/RailBrakeCalculator/app/src/main/java buildsrc/RailBrakeCalculator/app/src/main/assets "$APK" | tee runtime-assets-debug.log

      - name: Decode release signing key
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          echo "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore

      - name: Build signed release APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        env:
          RAILBRAKE_KEYSTORE_PATH: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/release.keystore
          RAILBRAKE_STORE_PASSWORD: ${{ secrets.RAILBRAKE_STORE_PASSWORD }}
          RAILBRAKE_KEY_ALIAS: ${{ secrets.RAILBRAKE_KEY_ALIAS }}
          RAILBRAKE_KEY_PASSWORD: ${{ secrets.RAILBRAKE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build-release.log

      - name: Verify signed release package signature and runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          APK=buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-badging.log
          grep -Fq "package: name='ru.railbrake.calculator' versionCode='144' versionName='1.2.2-dev14-hotfix2'" apk-badging.log
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signed-apksigner.log
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNING_CERT_SHA256" signed-apksigner.log
          python3 qa/verify_technical_assets_in_apk.py "$APK" | tee technical-assets-release.log
          python3 qa/verify_runtime_asset_paths.py buildsrc/RailBrakeCalculator/app/src/main/java buildsrc/RailBrakeCalculator/app/src/main/assets "$APK" | tee runtime-assets-release.log

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RailBrakeCalculator-1.2.2-dev14-hotfix2-release-signed
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev14-safe-build-verification
          path: |
            runtime-assets-source.log
            runtime-assets-overlay.log
            runtime-assets-debug.log
            runtime-assets-release.log
            technical-assets-debug.log
            technical-assets-release.log
            apk-badging.log
            signed-apksigner.log
            buildsrc/RailBrakeCalculator/unit-tests.log
            buildsrc/RailBrakeCalculator/lint.log
            buildsrc/RailBrakeCalculator/build-debug.log
            buildsrc/RailBrakeCalculator/build-release.log
          if-no-files-found: warn
          retention-days: 7
