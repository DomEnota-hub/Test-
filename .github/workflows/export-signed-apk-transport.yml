name: Export signed APK transport

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/export-signed-apk-transport.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export text chunks
        shell: bash
        run: |
          rm -rf artifacts/transport
          mkdir -p artifacts/transport
          base64 -w0 artifacts/RailBrakeCalculator-1.2.2-dev9-signed.apk | split -b 250000 - artifacts/transport/dev9-apk.b64.part-
          sha256sum artifacts/RailBrakeCalculator-1.2.2-dev9-signed.apk > artifacts/transport/SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/transport
          git commit -m "Export signed APK transport chunks"
          git push
