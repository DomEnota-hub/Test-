name: Dev14 workflow repair

on:
  push:
    branches:
      - dev14-integration
    paths:
      - .github/workflows/dev14-workflow-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev14-integration
          fetch-depth: 0

      - name: Repair canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/repair_workflow.py <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/build-apk-from-zip.yml')
          text = path.read_text(encoding='utf-8')

          mirror = '            "src/main/java/ru/railbrake/calculator/core/TechnicalDataRepository.kt"\n'
          if mirror not in text:
              text = text.replace('            "build.gradle.kts"\n', '            "build.gradle.kts"\n' + mirror, 1)

          text = re.sub(
              r'\n      - name: Android critical-path smoke\n.*?(?=\n      - name: Build unsigned release APK)',
              '',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'\n      - name: Build immutable dev13 signed release for upgrade check\n.*?(?=\n      - name: Upload signed release APK)',
              '',
              text,
              flags=re.S,
          )

          for task in (':app:testDebugUnitTest', ':app:lintDebug', ':app:assembleDebug', ':app:assembleRelease'):
              text = text.replace('          gradle ' + task + ' ', '          timeout --signal=TERM 15m gradle ' + task + ' ')

          if 'Verify technical assets in debug APK' not in text:
              anchor = '      - name: Upload debug APK\n'
              block = '''      - name: Verify technical assets in debug APK
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/qa/verify_technical_assets_in_apk.py" app/build/outputs/apk/debug/app-debug.apk | tee technical-assets-debug.log

'''
              if anchor not in text:
                  raise SystemExit('debug upload anchor missing')
              text = text.replace(anchor, block + anchor, 1)

          if 'technical-assets-release.log' not in text:
              cert_line = '          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNING_CERT_SHA256" signed-apksigner.log\n'
              extra = '          python3 "$GITHUB_WORKSPACE/qa/verify_technical_assets_in_apk.py" "$APK" | tee technical-assets-release.log\n'
              if cert_line not in text:
                  raise SystemExit('certificate anchor missing')
              text = text.replace(cert_line, cert_line + extra, 1)

          logs_anchor = '            buildsrc/RailBrakeCalculator/signed-apksigner.log\n'
          if 'buildsrc/RailBrakeCalculator/technical-assets-debug.log' not in text:
              text = text.replace(
                  logs_anchor,
                  logs_anchor + '            buildsrc/RailBrakeCalculator/technical-assets-debug.log\n            buildsrc/RailBrakeCalculator/technical-assets-release.log\n',
                  1,
              )

          path.write_text(text, encoding='utf-8')
          PY
          python3 /tmp/repair_workflow.py
          grep -Fq 'TechnicalDataRepository.kt' .github/workflows/build-apk-from-zip.yml
          grep -Fq 'Verify technical assets in debug APK' .github/workflows/build-apk-from-zip.yml
          grep -Fq 'technical-assets-release.log' .github/workflows/build-apk-from-zip.yml
          ! grep -Fq 'Android critical-path smoke' .github/workflows/build-apk-from-zip.yml
          ! grep -Fq 'Verify in-place upgrade dev13 to dev14' .github/workflows/build-apk-from-zip.yml
          grep -Fq 'timeout --signal=TERM 15m gradle :app:testDebugUnitTest' .github/workflows/build-apk-from-zip.yml
          git diff --check

      - name: Commit workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/build-apk-from-zip.yml
          git commit -m 'ci(dev14): verify packaged technical assets and remove emulator gates'
          git push origin HEAD:dev14-integration
