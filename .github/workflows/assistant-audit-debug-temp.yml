name: Assistant diagnostic audit debug final

on:
  push:
    branches:
      - feature/offline-assistant-v0.9
    paths:
      - .github/workflows/assistant-audit-debug-temp.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare source tree
        shell: bash
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/
      - name: Run corpus audit and print failure reports
        working-directory: buildsrc/RailBrakeCalculator
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest --tests 'ru.railbrake.calculator.core.assistant.AssistantDiagnosticCorpusTest' --stacktrace --console=plain
          status=$?
          echo '===== DIAGNOSTIC CORPUS REPORTS ====='
          find app/build/test-results/testDebugUnitTest -type f -name 'TEST-*AssistantDiagnosticCorpusTest*.xml' -print -exec cat {} \; || true
          exit $status
